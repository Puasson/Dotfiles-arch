# Generado desde home-manager (kitty.nix) — editable a mano.
# El color lo gobierna theme-current.conf (theme-apply lo actualiza).
include theme-current.conf

allow_remote_control socket-only
listen_on unix:/tmp/kitty-socket
font_family JetBrainsMono Nerd Font
font_size 11.5
cursor_beam_thickness 1
cursor_shape underline
url_style curly
detect_urls yes
open_url_with default
background_opacity 0.90
window_padding_width 8
hide_window_decorations yes
disable_ligatures never
tab_bar_style powerline
tab_bar_min_tabs 2
tab_switch_strategy previous
enable_audio_bell no
confirm_os_window_close 1
scrollback_lines 10000
scrollback_pager nvim -R -c 'set nowrap nonumber nolist showtabline=0' +G -
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier 2.0
touch_scroll_multiplier 2.0
copy_on_select no
strip_trailing_spaces smart
clipboard_control write-clipboard read-clipboard-ask read-primary-ask
clipboard_max_size 64
paste_actions confirm,confirm-if-large,replace-dangerous-control-codes
update_check_interval 0
enabled_layouts splits,stack
remember_window_size no
mouse_hide_wait 1.0
repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+r start_resizing_window
map ctrl+shift+u next_layout
map ctrl+shift+9 last_used_layout
map ctrl+shift+w close_window
map ctrl+shift+d detach_window

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map alt+left previous_tab
map alt+right next_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+enter new_window_with_cwd

map ctrl+shift+z jump_to_previous_prompt
map ctrl+shift+x jump_to_next_prompt

map ctrl+shift+s show_scrollback
map ctrl+shift+g show_last_command_output

map ctrl+shift+e open_url_with_hints
map ctrl+shift+o kitten hints --type linenum --linenum-action=tab nvim +{line} {path}
map ctrl+shift+y kitten hints --type path --program -

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b
